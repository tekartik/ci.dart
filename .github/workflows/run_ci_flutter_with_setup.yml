name: Run CI flutter with setup
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: repo_support
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter: stable
          - os: ubuntu-latest
            flutter: beta
          - os: windows-latest
            flutter: stable
          - os: macos-latest
            flutter: stable
    steps:
      - name: Setup flutter
        uses: tekartik/ci.dart/.github/actions/setup_ci_flutter@v1
      - run: flutter --version
      - run: flutter upgrade
      - run: dart --version
      - run: dart pub get
      - run: dart run tool/run_ci.dart