# Prefer the new default run_ci_workflow_flutter_analyze.yml (reusable workflow,
# one job per step).
name: Run CI Flutter downgrade analyze
on:
  push:
    branches: ['**'] # Not on tag pushes
    paths-ignore: ['**.md'] # Not on doc only changes
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

# A new run on the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter: stable
    steps:
      - name: Setup flutter
        uses: tekartik/ci.dart/.github/actions/setup_ci_flutter@v1
      - run: dart --version
      - run: flutter --version
      - run: dart pub global activate dev_build
      - run: dart pub global run dev_build:run_ci --pub-downgrade --analyze --no-override --recursive