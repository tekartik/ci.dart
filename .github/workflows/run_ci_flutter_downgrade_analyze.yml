name: Run CI Flutter downgrade analyze
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter: stable
    steps:
      - run_ci_flutter:
          yml:
        name: Run ci flutter
            uses: tekartik/ci.dart/.github/actions/run_ci_flutter@v1
            with:
              flutter-
          channel: ${{ matrix.flutter }}
      - run: dart --version
      - run: flutter --version
      - run: dart pub global activate dev_build
      - run: dart pub global run dev_build:run_ci --pub-downgrade --analyze --no-override --recursive