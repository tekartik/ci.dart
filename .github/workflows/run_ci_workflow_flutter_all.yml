# New default (preferred over run_ci_action_flutter.yml): run ci as separate
# jobs (pub get, analyze, format, test, build) for each os/channel.
name: Run CI workflow flutter all
on:
  push:
    branches: ['**'] # Not on tag pushes
    paths-ignore: ['**.md'] # Not on doc only changes
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

# One job per os/channel (no matrix) so that each one is displayed as its own
# group (pub get then analyze, format, test, build) in the workflow graph.
jobs:
  ubuntu_stable:
    name: ubuntu stable
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_jobs.yml@v1
    with:
      channel: stable
      runs-on: ubuntu-latest

  ubuntu_beta:
    name: ubuntu beta
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_jobs.yml@v1
    with:
      channel: beta
      runs-on: ubuntu-latest

  windows_stable:
    name: windows stable
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_jobs.yml@v1
    with:
      channel: stable
      runs-on: windows-latest

  macos_stable:
    name: macos stable
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_jobs.yml@v1
    with:
      channel: stable
      runs-on: macos-latest
