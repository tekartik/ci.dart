# Prefer the new default run_ci_workflow_flutter_all.yml (reusable workflow,
# one job per step).
name: Run CI flutter
on:
  push:
    branches: ['**'] # Not on tag pushes
    paths-ignore: ['**.md'] # Not on doc only changes
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

# A new run on the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repo_support
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter: stable
          - os: ubuntu-latest
            flutter: beta
          - os: windows-latest
            flutter: stable
          - os: macos-latest
            flutter: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter }}
      - run: flutter --version
      - run: flutter upgrade
      - run: dart --version
      - run: dart pub get
      - run: dart run tool/run_ci.dart