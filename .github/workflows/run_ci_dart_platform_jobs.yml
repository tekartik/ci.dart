# Reusable workflow: run the platform specific part of ci (vm test only) for
# the runners where analyze, format, web/node tests and the web build would
# only repeat what the ubuntu run_ci_dart_jobs.yml jobs already cover
# (windows, macos).
#
# Usage (from another workflow, next to run_ci_dart_jobs.yml on ubuntu):
#
# jobs:
#   windows_stable:
#     name: windows stable
#     uses: tekartik/ci.dart/.github/workflows/run_ci_dart_platform_jobs.yml@v1
#     with:
#       runs-on: windows-latest
#
# Two independent jobs, each one with its own pub get (nothing to share):
# - test: vm test.
# - build: the builds but the web one (run_ci --build --no-web-build, no
#   webdev activation), the web build (platform independent) is done on
#   ubuntu. None for now (run_ci only builds for the web), the place for the
#   desktop builds.
#
# A new run of the calling workflow on the same ref cancels the older one.
name: Run CI dart platform jobs
on:
  workflow_call:
    inputs:
      sdk:
        description: 'Dart sdk channel or version (stable, beta, dev, 3.13.x...)'
        type: string
        required: false
        default: 'stable'
      runs-on:
        description: 'Runner (windows-latest, macos-latest, ubuntu-latest)'
        type: string
        required: false
        default: 'windows-latest'
      timeout-minutes:
        description: 'Timeout of each job in minutes'
        type: number
        required: false
        default: 30

permissions:
  contents: read

# The calling workflow (workflow_ref includes the ref) and the inputs are part
# of the group so that the calls for each os/sdk do not cancel each other.
concurrency:
  group: run-ci-dart-platform-jobs-${{ github.workflow_ref }}-${{ inputs.runs-on }}-${{ inputs.sdk }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (vm)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ inputs.sdk }}
      - run: dart --version
      - run: dart run dev_build:run_ci@ --pub-get --recursive
      - run: dart run dev_build:run_ci@ --vm-test --no-pub-get --recursive

  build:
    name: Build (no web)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ inputs.sdk }}
      - run: dart --version
      - run: dart run dev_build:run_ci@ --pub-get --recursive
      # The web build is done on ubuntu, no webdev needed.
      - run: dart run dev_build:run_ci@ --build --no-web-build --no-pub-get --recursive
