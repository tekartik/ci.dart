# New default (preferred over run_ci_action_dart_default.yml): run ci as
# separate jobs (pub get, analyze, format, test, build).
name: Run CI workflow dart default
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  ci:
    name: Run ci
    # From another repository:
    # uses: tekartik/ci.dart/.github/workflows/run_ci_dart_jobs.yml@v1
    uses: ./.github/workflows/run_ci_dart_jobs.yml
