# Reusable workflow: run the platform specific part of ci (vm test only) for
# the runners where analyze, format, web tests and the web build would only
# repeat what the ubuntu run_ci_flutter_jobs.yml jobs already cover (windows,
# macos).
#
# Usage (from another workflow, next to run_ci_flutter_jobs.yml on ubuntu):
#
# jobs:
#   windows_stable:
#     name: windows stable
#     uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_platform_jobs.yml@v1
#     with:
#       runs-on: windows-latest
#
# With private git dependencies (git@github.com:...), pass an ssh key:
#
#     secrets:
#       SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
#
# Two independent jobs, each one with its own pub get (nothing to share):
# - test: vm test (flutter test for flutter packages, dart test -p vm for dart
#   packages).
# - build: the builds but the web one (run_ci --build --no-web-build), the web
#   build (platform independent) is done on ubuntu. None for now (run_ci only
#   builds for the web), the place for the desktop builds.
#
# A new run of the calling workflow on the same ref cancels the older one.
name: Run CI flutter platform jobs
on:
  workflow_call:
    inputs:
      channel:
        description: 'Flutter channel (stable, beta, master)'
        type: string
        required: false
        default: 'stable'
      runs-on:
        description: 'Runner (windows-latest, macos-latest, ubuntu-latest)'
        type: string
        required: false
        default: 'windows-latest'
      cache:
        description: >-
          Cache the flutter sdk (~2GB per os/channel) and the pub cache across
          runs. The repository cache is limited to 10GB, set it to false if
          many os/channel are used.
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: 'Timeout of each job in minutes'
        type: number
        required: false
        default: 30
    secrets:
      SSH_PRIVATE_KEY:
        description: >-
          SSH private key for private git dependencies, loaded in an ssh-agent
          before pub get.
        required: false

permissions:
  contents: read

# The calling workflow (workflow_ref includes the ref) and the inputs are part
# of the group so that the calls for each os/channel do not cancel each other.
concurrency:
  group: run-ci-flutter-platform-jobs-${{ github.workflow_ref }}-${{ inputs.runs-on }}-${{ inputs.channel }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (vm)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: tekartik/ci.dart/.github/actions/setup_ci_flutter@v1
        with:
          flutter-channel: ${{ inputs.channel }}
          cache: ${{ inputs.cache }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: flutter --version
      - run: dart run dev_build:run_ci@ --pub-get --recursive
      - run: dart run dev_build:run_ci@ --vm-test --no-pub-get --recursive

  build:
    name: Build (no web)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: tekartik/ci.dart/.github/actions/setup_ci_flutter@v1
        with:
          flutter-channel: ${{ inputs.channel }}
          cache: ${{ inputs.cache }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: flutter --version
      - run: dart run dev_build:run_ci@ --pub-get --recursive
      # The web build is done on ubuntu.
      - run: dart run dev_build:run_ci@ --build --no-web-build --no-pub-get --recursive
