name: 'Setup Dart'
description: 'Checkout code + setup Flutter (with caching). Reusable across repositories.'

inputs:
  dart-channel:
    description: 'Dart channel or version (stable, beta, master, 3.24.x, etc.)'
    required: true
    default: 'stable'

  cache:
    description: 'Enable pub cache'
    required: false
    default: 'true'

  cache-key-prefix:
    description: 'Prefix for cache key'
    required: false
    default: 'flutter'

  working-directory:
    description: 'Directory where flutter pub get should run'
    required: false
    default: '.'

  checkout-token:
    description: 'Token to use for checkout (useful for private repos)'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ inputs.checkout-token }}

    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ matrix.dart-channel }}
        # Workaround for https://github.com/dart-lang/setup-dart/issues/198:
        # setup-dart fails to register its analyzer problem matcher when used
        # inside a composite action. Disabling the matcher only skips GitHub
        # annotations; analyzer output is unchanged.
        # Same technique as https://github.com/leoafarias/fvm/pull/1071
        problem-matcher: false

